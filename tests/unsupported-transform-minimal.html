<!doctype html>
<meta charset="utf-8">
<title>HAVI repro: non-identity transform + overflow clip</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
}

.clip {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.centered {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 400px;
  height: 300px;
  transform: translate(-50%, -50%) scale(1.02);
}

.box {
  position: absolute;
  left: 50px;
  top: 50px;
  width: 200px;
  height: 100px;
  background: #f00;
}
</style>
<div class="clip">
  <div class="centered">
    <div class="box"></div>
  </div>
</div>
