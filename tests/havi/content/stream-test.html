<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Stream API Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Stream API Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>

  <script>
    async function suite_stream() {
        const homeRepo = window.home;
        const group = document.packet.group;
        const app = document.packet.app;

        // --- StreamOut creation ---
        log('--- StreamOut creation ---');
        const sout = homeRepo.streamOut('//' + group + '/' + app + '/live');
        assert(sout !== null && sout !== undefined, 'streamOut() returns object');
        assert(typeof sout.readyState === 'number', 'StreamOut has readyState');
        assert(typeof sout.prefix === 'string', 'StreamOut has prefix');
        assertEqual(sout.prefix, '//' + group + '/' + app + '/live', 'StreamOut prefix matches');
        assert(sout.stream !== null && sout.stream !== undefined, 'StreamOut has stream attribute');
        assert(sout.stream instanceof ReadableStream, 'StreamOut.stream is ReadableStream');

        // --- StreamOut receives data ---
        log('--- StreamOut receives data ---');
        // The publisher is feeding data with a delay. Wait for onopen, then read.
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('StreamOut onopen timeout')), 15000);
            if (sout.readyState === 1) {
                clearTimeout(timeout);
                resolve();
            } else {
                sout.onopen = () => { clearTimeout(timeout); resolve(); };
                sout.onerror = () => { clearTimeout(timeout); reject(new Error('StreamOut error during connect')); };
            }
        });
        assertEqual(sout.readyState, 1, 'StreamOut readyState is OPEN after onopen');

        const reader = sout.stream.getReader();
        // Read with a timeout: publisher sends data after a delay
        const readResult = await Promise.race([
            reader.read(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('StreamOut read timeout')), 20000))
        ]);
        assert(!readResult.done, 'StreamOut read is not done (got data)');
        assert(readResult.value instanceof Uint8Array, 'StreamOut read value is Uint8Array');
        assert(readResult.value.length > 0, 'StreamOut received non-empty data (' + readResult.value.length + ' bytes)');

        // The received data is a trailer-format segment. Check it starts with the stream mark.
        const decoder = new TextDecoder();
        const text = decoder.decode(readResult.value.slice(0, 100));
        assertContains(text, 'S //', 'received data contains trailer seal opening');

        reader.releaseLock();
        sout.close();

        // --- StreamIn creation ---
        log('--- StreamIn creation ---');
        const sin = homeRepo.streamIn('//' + group + '/' + app + '/live2');
        assert(sin !== null && sin !== undefined, 'streamIn() returns object');
        assert(typeof sin.readyState === 'number', 'StreamIn has readyState');
        assert(typeof sin.prefix === 'string', 'StreamIn has prefix');
        assertEqual(sin.prefix, '//' + group + '/' + app + '/live2', 'StreamIn prefix matches');

        // --- StreamIn onopen ---
        log('--- StreamIn onopen ---');
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('StreamIn onopen timeout')), 10000);
            if (sin.readyState === 1) {
                clearTimeout(timeout);
                resolve();
            } else {
                sin.onopen = () => { clearTimeout(timeout); resolve(); };
                sin.onerror = () => { clearTimeout(timeout); reject(new Error('StreamIn error during connect')); };
            }
        });
        assertEqual(sin.readyState, 1, 'StreamIn readyState is OPEN after onopen');

        // --- StreamIn write ---
        log('--- StreamIn write ---');
        const testData = new Uint8Array([72, 69, 76, 76, 79]); // "HELLO"
        const writeResult = await sin.write(testData);
        assertEqual(writeResult, undefined, 'StreamIn write resolves to undefined');

        sin.close();
    }

    (async function() {
      const summary = await window.runTests(suite_stream, 'stream');
      window.testResults = summary;
      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!' : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
