<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Stream API Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Stream API Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>

  <script>
    async function suite_stream() {
        const homeRepo = window.home;
        const streamRepo = await HpprClient.connect(homeRepo.endpoint, 'anyone');
        const group = document.packet.group;
        const app = document.packet.app;

        // --- StreamSub creation ---
        log('--- StreamSub creation ---');
        const sout = streamRepo.streamSub('//' + group + '/' + app + '/live');
        assert(sout !== null && sout !== undefined, 'streamSub() returns object');
        assert(typeof sout.readyState === 'number', 'StreamSub has readyState');
        assert(typeof sout.prefix === 'string', 'StreamSub has prefix');
        assertEqual(sout.prefix, '//' + group + '/' + app + '/live', 'StreamSub prefix matches');
        assert(sout.stream !== null && sout.stream !== undefined, 'StreamSub has stream attribute');
        assert(sout.stream instanceof ReadableStream, 'StreamSub.stream is ReadableStream');

        // --- StreamSub receives data ---
        log('--- StreamSub receives data ---');
        // The publisher is feeding data with a delay. Wait for onopen, then read.
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('StreamSub onopen timeout')), 15000);
            if (sout.readyState === 1) {
                clearTimeout(timeout);
                resolve();
            } else {
                sout.onopen = () => { clearTimeout(timeout); resolve(); };
                sout.onerror = () => { clearTimeout(timeout); reject(new Error('StreamSub error during connect')); };
            }
        });
        assertEqual(sout.readyState, 1, 'StreamSub readyState is OPEN after onopen');

        const reader = sout.stream.getReader();
        // Read with a timeout: publisher sends data after a delay
        const readResult = await Promise.race([
            reader.read(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('StreamSub read timeout')), 20000))
        ]);
        assert(!readResult.done, 'StreamSub read is not done (got data)');
        assert(readResult.value instanceof Uint8Array, 'StreamSub read value is Uint8Array');
        assert(readResult.value.length > 0, 'StreamSub received non-empty data (' + readResult.value.length + ' bytes)');

        // The ReadableStream delivers decoded payload bytes (not raw trailer format).
        const decoder = new TextDecoder();
        const text = decoder.decode(readResult.value);
        assertContains(text, 'hello-havi', 'received payload bytes match published content');

        reader.releaseLock();
        sout.close();

        const keyPacket = await homeRepo.get('//' + group + '/' + app + '/testkey');
        const key = keyPacket.text();
        assert(key.startsWith('&.'), 'Signing key loaded for streamPub');

        // --- StreamPub creation ---
        log('--- StreamPub creation ---');
        const sin = streamRepo.streamPub('//' + group + '/' + app + '/live2', { key });
        assert(sin !== null && sin !== undefined, 'streamPub() returns object');
        assert(typeof sin.readyState === 'number', 'StreamPub has readyState');
        assert(typeof sin.prefix === 'string', 'StreamPub has prefix');
        assertEqual(sin.prefix, '//' + group + '/' + app + '/live2', 'StreamPub prefix matches');

        // --- StreamPub onopen ---
        log('--- StreamPub onopen ---');
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('StreamPub onopen timeout')), 10000);
            if (sin.readyState === 1) {
                clearTimeout(timeout);
                resolve();
            } else {
                sin.onopen = () => { clearTimeout(timeout); resolve(); };
                sin.onerror = () => { clearTimeout(timeout); reject(new Error('StreamPub error during connect')); };
            }
        });
        assertEqual(sin.readyState, 1, 'StreamPub readyState is OPEN after onopen');

        // --- StreamPub write ---
        log('--- StreamPub write ---');
        const testData = new Uint8Array([72, 69, 76, 76, 79]); // "HELLO"
        const writeResult = await sin.write(testData);
        assertEqual(writeResult, undefined, 'StreamPub write resolves to undefined');

        sin.close();
    }

    (async function() {
      const summary = await window.runTests(suite_stream, 'stream');
      window.testResults = summary;
      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!' : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
