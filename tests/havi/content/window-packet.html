<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Packet Surface Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Packet Surface Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>

  <script>
    async function suite_window_packet() {
        log('--- packet surface existence tests ---');
        assert(window.packet !== undefined, 'window.packet is defined');
        assert(document.packet !== undefined, 'document.packet is defined');
        assertEqual(typeof window.havi, 'undefined', 'window.havi is removed from ordinary pages');
        assertEqual(typeof window.ring0, 'undefined', 'window.ring0 is removed from the Window surface');

        log('--- packet content tests ---');
        assert(window.packet !== null, 'window.packet is not null for current navigation');
        assert(document.packet !== null, 'document.packet is not null for current navigation');
        assertEqual(typeof window.packet.hash, 'string', 'window.packet.hash is a string');
        assertEqual(typeof document.packet.hash, 'string', 'document.packet.hash is a string');
        assertEqual(window.packet.hash, document.packet.hash, 'window.packet and document.packet refer to the same current packet');
        assertEqual(window.packet.type, document.packet.type, 'window.packet and document.packet share packet type');

        log('--- source descriptor tests ---');
        assert(window.source !== null, 'window.source exists on repo-backed page');
        assertEqual(window.source.kind, 'repo', 'window.source.kind is repo on local committed-source page');
        assert(window.source.client !== null, 'window.source.client exists');
    }

    (async function() {
      const summary = await window.runTests(suite_window_packet, 'window-packet');
      window.testResults = summary;
      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
