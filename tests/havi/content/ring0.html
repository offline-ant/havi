<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Ring0 Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Ring0 Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <!-- Load shared utilities -->
  <script src="test-utils.js"></script>

  <!-- Inline test suite -->
  <script>
    async function suite_ring0() {
        log('--- window.ring0 existence tests (havi:// only) ---');
        assert(window.ring0 !== null, 'window.ring0 exists on havi:// page');
        assert(window.ring0.ring1Name !== null, 'ring0.ring1Name is not null (has credentials)');
        assert(typeof window.ring0.endpoint === 'string', 'ring0.endpoint is a string');

        log('--- ring0.repo tests ---');
        assert(window.ring0.repo !== null, 'ring0.repo is not null');
        assert(typeof window.ring0.repo.port === 'function', 'repo.port is function');
        assert(typeof window.ring0.repo.status === 'function', 'repo.status is function');

        await runTest('ring0.repo.port()', async () => {
            const port = await window.ring0.repo.port();
            assert(typeof port === 'number', 'repo.port() returns a number');
            assert(port > 0, 'repo.port() returns positive number');
        });

        await runTest('ring0.repo.status()', async () => {
            const status = await window.ring0.repo.status();
            assertEqual(typeof status, 'string', 'repo.status() returns a string');
            assert(status.length > 0, 'repo.status() is non-empty');
        });
    }

    // Auto-run suite
    (async function() {
      const summary = await window.runTests(suite_ring0, 'ring0');

      window.testResults = summary;

      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
