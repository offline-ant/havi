<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Internal Admin Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Internal Admin Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>
  <script>
    async function suite_ring0() {
        log('--- window.havi existence tests (havi:// only) ---');
        assert(window.havi !== null, 'window.havi exists on havi:// page');
        assert(window.havi.admin !== null, 'window.havi.admin exists when admin credentials are present');
        assert(window.havi.admin.client.ring1Name !== null, 'admin client ring1Name is not null');
        assert(typeof window.havi.admin.client.endpoint === 'string', 'admin client endpoint is a string');
        assertEqual(typeof window.ring0, 'undefined', 'window.ring0 is removed from the Window surface');

        log('--- window.havi.admin.repo tests ---');
        assert(typeof window.havi.admin.repo.port === 'function', 'repo.port is function');
        assert(typeof window.havi.admin.repo.status === 'function', 'repo.status is function');

        await runTest('window.havi.admin.repo.port()', async () => {
            const port = await window.havi.admin.repo.port();
            assert(typeof port === 'number', 'repo.port() returns a number');
            assert(port > 0, 'repo.port() returns positive number');
        });

        await runTest('window.havi.admin.repo.status()', async () => {
            const status = await window.havi.admin.repo.status();
            assertEqual(typeof status, 'string', 'repo.status() returns a string');
            assert(status.length > 0, 'repo.status() is non-empty');
        });
    }

    (async function() {
      const summary = await window.runTests(suite_ring0, 'ring0');

      window.testResults = summary;

      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
