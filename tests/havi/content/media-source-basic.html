<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaSource Basic Test</title>
</head>
<body>
  <pre id="results"></pre>
  <script src="test-utils.js"></script>
  <script>
    function waitEvent(target, name, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(name + ' timeout'));
        }, timeoutMs);
        target.addEventListener(name, function handler(event) {
          clearTimeout(timer);
          target.removeEventListener(name, handler);
          resolve(event);
        });
      });
    }

    function expectThrows(fn, name) {
      try {
        fn();
        assert(false, name);
      } catch (_) {
        assert(true, name);
      }
    }

    async function suite_media_source_basic() {
      log('--- MediaSource API surface ---');

      assert(typeof window.MediaSource === 'function', 'MediaSource constructor is exposed');
      assert(typeof window.SourceBuffer === 'function', 'SourceBuffer constructor is exposed');
      assert(MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"'),
        'MediaSource accepts MP4/H.264');
      assert(MediaSource.isTypeSupported('video/mp4; codecs="av01.0.04M.08"'),
        'MediaSource accepts MP4/AV1');
      assert(!MediaSource.isTypeSupported('video/webm; codecs="vp9"'),
        'MediaSource rejects WebM/VP9');

      const mediaSource = new MediaSource();
      assertEqual(mediaSource.readyState, 'closed', 'new MediaSource starts closed');
      assert(Number.isNaN(mediaSource.duration), 'new MediaSource duration starts NaN');
      assertEqual(mediaSource.sourceBuffers.length, 0, 'new MediaSource sourceBuffers starts empty');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'new MediaSource activeSourceBuffers starts empty');
      expectThrows(
        () => mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"'),
        'addSourceBuffer rejects while MediaSource is closed');

      const url = URL.createObjectURL(mediaSource);
      assert(url.startsWith('blob:'), 'createObjectURL(MediaSource) returns blob URL');

      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      document.body.appendChild(video);

      const opened = waitEvent(mediaSource, 'sourceopen');
      video.src = url;
      await opened;
      assertEqual(mediaSource.readyState, 'open', 'MediaSource opens when attached to video');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers stays empty before addSourceBuffer');

      mediaSource.duration = 2.5;
      assertEqual(mediaSource.duration, 2.5, 'MediaSource duration setter stores explicit duration');
      assertEqual(video.duration, 2.5, 'MediaSource duration setter updates attached media element');

      const sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      assert(sourceBuffer instanceof SourceBuffer, 'addSourceBuffer returns SourceBuffer');
      assertEqual(sourceBuffer.updating, false, 'SourceBuffer starts idle');
      assertEqual(mediaSource.sourceBuffers.length, 1, 'sourceBuffers length updates after add');
      assertEqual(mediaSource.activeSourceBuffers.length, 1,
        'activeSourceBuffers length updates after add');
      assert(mediaSource.sourceBuffers[0] === sourceBuffer, 'sourceBuffers[0] exposes added SourceBuffer');
      assert(mediaSource.activeSourceBuffers[0] === sourceBuffer,
        'activeSourceBuffers[0] exposes active SourceBuffer');

      log('--- append invalid bytes to exercise shell/session path ---');
      const appendStart = waitEvent(sourceBuffer, 'updatestart');
      const appendEnd = waitEvent(sourceBuffer, 'updateend');
      sourceBuffer.appendBuffer(new Uint8Array([1, 2, 3, 4]));
      await appendStart;
      assert(sourceBuffer.updating, 'appendBuffer sets updating');
      await appendEnd;
      assertEqual(sourceBuffer.updating, false, 'appendBuffer completion clears updating');
      assertEqual(sourceBuffer.buffered.length, 0, 'truncated append leaves buffered empty');

      log('--- remove and endOfStream remain wired ---');
      const removeStart = waitEvent(sourceBuffer, 'updatestart');
      const removeEnd = waitEvent(sourceBuffer, 'updateend');
      sourceBuffer.remove(0, 1);
      await removeStart;
      await removeEnd;
      assertEqual(sourceBuffer.updating, false, 'remove clears updating');

      const ended = waitEvent(mediaSource, 'sourceended');
      mediaSource.endOfStream();
      await ended;
      assertEqual(mediaSource.readyState, 'ended', 'endOfStream moves readyState to ended');
      assertEqual(mediaSource.activeSourceBuffers.length, 1,
        'activeSourceBuffers stays populated while MediaSource is ended');

      log('--- detach keeps ownership explicit and rejects detached buffer operations ---');
      const detachedSource = new MediaSource();
      const detachedUrl = URL.createObjectURL(detachedSource);
      const detachedVideo = document.createElement('video');
      detachedVideo.muted = true;
      detachedVideo.playsInline = true;
      document.body.appendChild(detachedVideo);
      const detachedOpen = waitEvent(detachedSource, 'sourceopen');
      detachedVideo.src = detachedUrl;
      await detachedOpen;
      const detachedBuffer = detachedSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      assertEqual(detachedSource.sourceBuffers.length, 1,
        'detachedSource starts with one attached SourceBuffer');
      const detachedClose = waitEvent(detachedSource, 'sourceclose');
      detachedVideo.removeAttribute('src');
      detachedVideo.load();
      await detachedClose;
      assertEqual(detachedSource.readyState, 'closed', 'detaching media element closes MediaSource with live buffers');
      assertEqual(detachedSource.sourceBuffers.length, 1,
        'sourceBuffers keeps registered buffers across detach');
      assertEqual(detachedSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers clears when MediaSource is detached');
      expectThrows(
        () => detachedBuffer.appendBuffer(new Uint8Array([9, 8, 7])),
        'detached SourceBuffer appendBuffer rejects while MediaSource is closed');
      expectThrows(
        () => detachedBuffer.remove(0, 1),
        'detached SourceBuffer remove rejects while MediaSource is closed');
      expectThrows(
        () => detachedSource.endOfStream(),
        'detached MediaSource endOfStream rejects while closed');

      const reattachedOpen = waitEvent(detachedSource, 'sourceopen');
      detachedVideo.src = detachedUrl;
      await reattachedOpen;
      assertEqual(detachedSource.readyState, 'open', 'MediaSource reopens when reattached');
      assertEqual(detachedSource.activeSourceBuffers.length, 1,
        'activeSourceBuffers restores registered buffers on reattach');
      assert(detachedSource.activeSourceBuffers[0] === detachedBuffer,
        'reattach preserves SourceBuffer ownership');
      URL.revokeObjectURL(detachedUrl);

      log('--- removeSourceBuffer updates lists and removed-state checks ---');
      mediaSource.removeSourceBuffer(sourceBuffer);
      assertEqual(mediaSource.sourceBuffers.length, 0, 'removeSourceBuffer clears sourceBuffers');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'removeSourceBuffer clears activeSourceBuffers');
      assertEqual(sourceBuffer.buffered.length, 0,
        'removed SourceBuffer clears buffered ranges');
      expectThrows(
        () => mediaSource.removeSourceBuffer(sourceBuffer),
        'removeSourceBuffer rejects a missing buffer');
      expectThrows(
        () => sourceBuffer.appendBuffer(new Uint8Array([1, 2, 3])),
        'removed SourceBuffer appendBuffer rejects');
      expectThrows(
        () => sourceBuffer.remove(0, 1),
        'removed SourceBuffer remove rejects');
      log('--- detach closes MediaSource after buffer removal ---');
      const closed = waitEvent(mediaSource, 'sourceclose');
      video.removeAttribute('src');
      video.load();
      await closed;
      assertEqual(mediaSource.readyState, 'closed', 'detaching media element closes MediaSource');
      assertEqual(mediaSource.sourceBuffers.length, 0, 'sourceBuffers stays empty across detach');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers stays empty on detach');

      URL.revokeObjectURL(url);
      assert(true, 'revokeObjectURL(MediaSource) completed');
    }

    (async function() {
      const summary = await window.runTests(suite_media_source_basic, 'media-source-basic');
      window.testResults = summary;
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
