<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaSource Basic Test</title>
</head>
<body>
  <pre id="results"></pre>
  <script src="test-utils.js"></script>
  <script>
    function waitEvent(target, name, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(name + ' timeout'));
        }, timeoutMs);
        target.addEventListener(name, function handler(event) {
          clearTimeout(timer);
          target.removeEventListener(name, handler);
          resolve(event);
        });
      });
    }

    function expectThrows(fn, name) {
      try {
        fn();
        assert(false, name);
      } catch (_) {
        assert(true, name);
      }
    }

    async function suite_media_source_basic() {
      log('--- MediaSource API surface ---');

      assert(typeof window.MediaSource === 'function', 'MediaSource constructor is exposed');
      assert(typeof window.SourceBuffer === 'function', 'SourceBuffer constructor is exposed');
      assert(MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"'),
        'MediaSource accepts MP4/H.264');
      assert(MediaSource.isTypeSupported('video/mp4; codecs="av01.0.04M.08"'),
        'MediaSource accepts MP4/AV1');
      assert(!MediaSource.isTypeSupported('video/webm; codecs="vp9"'),
        'MediaSource rejects WebM/VP9');

      const mediaSource = new MediaSource();
      assertEqual(mediaSource.readyState, 'closed', 'new MediaSource starts closed');
      assert(Number.isNaN(mediaSource.duration), 'new MediaSource duration starts NaN');
      assertEqual(mediaSource.sourceBuffers.length, 0, 'new MediaSource sourceBuffers starts empty');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'new MediaSource activeSourceBuffers starts empty');
      expectThrows(
        () => mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"'),
        'addSourceBuffer rejects while MediaSource is closed');

      const url = URL.createObjectURL(mediaSource);
      assert(url.startsWith('blob:'), 'createObjectURL(MediaSource) returns blob URL');

      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      document.body.appendChild(video);

      const opened = waitEvent(mediaSource, 'sourceopen');
      video.src = url;
      await opened;
      assertEqual(mediaSource.readyState, 'open', 'MediaSource opens when attached to video');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers stays empty before addSourceBuffer');

      mediaSource.duration = 2.5;
      assertEqual(mediaSource.duration, 2.5, 'MediaSource duration setter stores explicit duration');
      assertEqual(video.duration, 2.5, 'MediaSource duration setter updates attached media element');

      const sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      const secondSourceBuffer = mediaSource.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
      assert(sourceBuffer instanceof SourceBuffer, 'first addSourceBuffer returns SourceBuffer');
      assert(secondSourceBuffer instanceof SourceBuffer, 'second addSourceBuffer returns SourceBuffer');
      assertEqual(sourceBuffer.updating, false, 'first SourceBuffer starts idle');
      assertEqual(secondSourceBuffer.updating, false, 'second SourceBuffer starts idle');
      assertEqual(mediaSource.sourceBuffers.length, 2, 'sourceBuffers length updates after two adds');
      assertEqual(mediaSource.activeSourceBuffers.length, 2,
        'activeSourceBuffers length updates after two adds');
      assert(mediaSource.sourceBuffers[0] === sourceBuffer, 'sourceBuffers[0] exposes first SourceBuffer');
      assert(mediaSource.sourceBuffers[1] === secondSourceBuffer, 'sourceBuffers[1] exposes second SourceBuffer');
      assert(mediaSource.activeSourceBuffers[0] === sourceBuffer,
        'activeSourceBuffers[0] exposes first active SourceBuffer');
      assert(mediaSource.activeSourceBuffers[1] === secondSourceBuffer,
        'activeSourceBuffers[1] exposes second active SourceBuffer');

      log('--- per-buffer append routing stays isolated ---');
      const firstAppendStart = waitEvent(sourceBuffer, 'updatestart');
      const firstAppendEnd = waitEvent(sourceBuffer, 'updateend');
      sourceBuffer.appendBuffer(new Uint8Array([1, 2, 3, 4]));
      await firstAppendStart;
      assert(sourceBuffer.updating, 'first appendBuffer sets first SourceBuffer updating');
      assertEqual(secondSourceBuffer.updating, false,
        'first append does not mark second SourceBuffer updating');
      expectThrows(
        () => sourceBuffer.appendBuffer(new Uint8Array([9, 9, 9])),
        'appendBuffer rejects same SourceBuffer while updating');
      expectThrows(
        () => sourceBuffer.remove(0, 1),
        'remove rejects same SourceBuffer while append is updating');
      await firstAppendEnd;
      assertEqual(sourceBuffer.updating, false, 'first append completion clears updating');
      assertEqual(sourceBuffer.buffered.length, 0, 'first truncated append leaves buffered empty');
      assertEqual(secondSourceBuffer.buffered.length, 0,
        'first append does not mutate second SourceBuffer buffered ranges');

      const secondAppendStart = waitEvent(secondSourceBuffer, 'updatestart');
      const secondAppendEnd = waitEvent(secondSourceBuffer, 'updateend');
      secondSourceBuffer.appendBuffer(new Uint8Array([5, 6, 7, 8]));
      await secondAppendStart;
      assert(secondSourceBuffer.updating, 'second appendBuffer sets second SourceBuffer updating');
      assertEqual(sourceBuffer.updating, false,
        'second append does not re-mark first SourceBuffer updating');
      await secondAppendEnd;
      assertEqual(secondSourceBuffer.updating, false, 'second append completion clears updating');
      assertEqual(secondSourceBuffer.buffered.length, 0, 'second truncated append leaves buffered empty');

      log('--- per-buffer remove routing stays isolated and endOfStream remains wired ---');
      const removeStart = waitEvent(secondSourceBuffer, 'updatestart');
      const removeEnd = waitEvent(secondSourceBuffer, 'updateend');
      secondSourceBuffer.remove(0, 1);
      await removeStart;
      expectThrows(
        () => secondSourceBuffer.remove(0, 1),
        'remove rejects same SourceBuffer while remove is updating');
      await removeEnd;
      assertEqual(secondSourceBuffer.updating, false, 'second SourceBuffer remove clears updating');
      assertEqual(sourceBuffer.updating, false, 'second SourceBuffer remove leaves first SourceBuffer idle');

      const ended = waitEvent(mediaSource, 'sourceended');
      mediaSource.endOfStream();
      await ended;
      assertEqual(mediaSource.readyState, 'ended', 'endOfStream moves readyState to ended');
      assertEqual(mediaSource.activeSourceBuffers.length, 2,
        'activeSourceBuffers stays populated while MediaSource is ended');

      log('--- detach keeps ownership explicit and rejects detached buffer operations ---');
      const detachedSource = new MediaSource();
      const detachedUrl = URL.createObjectURL(detachedSource);
      const detachedVideo = document.createElement('video');
      detachedVideo.muted = true;
      detachedVideo.playsInline = true;
      document.body.appendChild(detachedVideo);
      const detachedOpen = waitEvent(detachedSource, 'sourceopen');
      detachedVideo.src = detachedUrl;
      await detachedOpen;
      const detachedBuffer = detachedSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      assertEqual(detachedSource.sourceBuffers.length, 1,
        'detachedSource starts with one attached SourceBuffer');
      const detachedClose = waitEvent(detachedSource, 'sourceclose');
      detachedVideo.removeAttribute('src');
      detachedVideo.load();
      await detachedClose;
      assertEqual(detachedSource.readyState, 'closed', 'detaching media element closes MediaSource with live buffers');
      assertEqual(detachedSource.sourceBuffers.length, 1,
        'sourceBuffers keeps registered buffers across detach');
      assertEqual(detachedSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers clears when MediaSource is detached');
      expectThrows(
        () => detachedBuffer.appendBuffer(new Uint8Array([9, 8, 7])),
        'detached SourceBuffer appendBuffer rejects while MediaSource is closed');
      expectThrows(
        () => detachedBuffer.remove(0, 1),
        'detached SourceBuffer remove rejects while MediaSource is closed');
      expectThrows(
        () => detachedSource.endOfStream(),
        'detached MediaSource endOfStream rejects while closed');

      const reattachedOpen = waitEvent(detachedSource, 'sourceopen');
      detachedVideo.src = detachedUrl;
      await reattachedOpen;
      assertEqual(detachedSource.readyState, 'open', 'MediaSource reopens when reattached');
      assertEqual(detachedSource.activeSourceBuffers.length, 1,
        'activeSourceBuffers restores registered buffers on reattach');
      assert(detachedSource.activeSourceBuffers[0] === detachedBuffer,
        'reattach preserves SourceBuffer ownership');
      URL.revokeObjectURL(detachedUrl);

      log('--- srcObject supports MediaSource with the same attach state machine ---');
      const srcObjectSource = new MediaSource();
      const srcObjectVideo = document.createElement('video');
      srcObjectVideo.muted = true;
      srcObjectVideo.playsInline = true;
      document.body.appendChild(srcObjectVideo);
      assertEqual(srcObjectVideo.srcObject, null, 'video.srcObject starts null');
      const srcObjectOpen = waitEvent(srcObjectSource, 'sourceopen');
      srcObjectVideo.srcObject = srcObjectSource;
      await srcObjectOpen;
      assert(srcObjectVideo.srcObject === srcObjectSource,
        'video.srcObject stores MediaSource identity');
      assertEqual(srcObjectSource.readyState, 'open',
        'srcObject MediaSource opens when attached');
      assertEqual(srcObjectVideo.currentSrc, '',
        'srcObject MediaSource keeps currentSrc empty');
      const srcObjectBuffer = srcObjectSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      assertEqual(srcObjectSource.sourceBuffers.length, 1,
        'srcObject MediaSource exposes added SourceBuffer');
      assertEqual(srcObjectSource.activeSourceBuffers.length, 1,
        'srcObject MediaSource exposes active SourceBuffer while attached');
      const srcObjectClose = waitEvent(srcObjectSource, 'sourceclose');
      srcObjectVideo.srcObject = null;
      await srcObjectClose;
      assertEqual(srcObjectVideo.srcObject, null, 'video.srcObject clears to null');
      assertEqual(srcObjectSource.readyState, 'closed',
        'clearing srcObject detaches and closes MediaSource');
      assertEqual(srcObjectSource.sourceBuffers.length, 1,
        'srcObject detach keeps SourceBuffer registered');
      assertEqual(srcObjectSource.activeSourceBuffers.length, 0,
        'srcObject detach clears activeSourceBuffers');
      expectThrows(
        () => srcObjectBuffer.appendBuffer(new Uint8Array([4, 3, 2, 1])),
        'detached srcObject SourceBuffer appendBuffer rejects');
      const srcObjectReopen = waitEvent(srcObjectSource, 'sourceopen');
      srcObjectVideo.srcObject = srcObjectSource;
      await srcObjectReopen;
      assertEqual(srcObjectSource.readyState, 'open',
        'reattaching same MediaSource through srcObject reopens it');
      assert(srcObjectVideo.srcObject === srcObjectSource,
        'reattached srcObject preserves MediaSource identity');
      assertEqual(srcObjectSource.activeSourceBuffers.length, 1,
        'srcObject reattach restores activeSourceBuffers');
      assert(srcObjectSource.activeSourceBuffers[0] === srcObjectBuffer,
        'srcObject reattach preserves SourceBuffer ownership');
      srcObjectVideo.srcObject = null;

      log('--- removeSourceBuffer updates lists and removed-state checks ---');
      mediaSource.removeSourceBuffer(sourceBuffer);
      assertEqual(mediaSource.sourceBuffers.length, 1, 'removeSourceBuffer keeps other SourceBuffers registered');
      assertEqual(mediaSource.activeSourceBuffers.length, 1,
        'removeSourceBuffer keeps remaining active SourceBuffers');
      assert(mediaSource.sourceBuffers[0] === secondSourceBuffer,
        'remaining SourceBuffer stays registered after first removal');
      assertEqual(sourceBuffer.buffered.length, 0,
        'removed SourceBuffer clears buffered ranges');
      expectThrows(
        () => mediaSource.removeSourceBuffer(sourceBuffer),
        'removeSourceBuffer rejects a missing buffer');
      expectThrows(
        () => sourceBuffer.appendBuffer(new Uint8Array([1, 2, 3])),
        'removed SourceBuffer appendBuffer rejects');
      expectThrows(
        () => sourceBuffer.remove(0, 1),
        'removed SourceBuffer remove rejects');

      mediaSource.removeSourceBuffer(secondSourceBuffer);
      assertEqual(mediaSource.sourceBuffers.length, 0, 'removing final SourceBuffer clears sourceBuffers');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'removing final SourceBuffer clears activeSourceBuffers');
      expectThrows(
        () => secondSourceBuffer.appendBuffer(new Uint8Array([4, 5, 6])),
        'removed second SourceBuffer appendBuffer rejects');
      log('--- detach closes MediaSource after buffer removal ---');
      const closed = waitEvent(mediaSource, 'sourceclose');
      video.removeAttribute('src');
      video.load();
      await closed;
      assertEqual(mediaSource.readyState, 'closed', 'detaching media element closes MediaSource');
      assertEqual(mediaSource.sourceBuffers.length, 0, 'sourceBuffers stays empty across detach');
      assertEqual(mediaSource.activeSourceBuffers.length, 0,
        'activeSourceBuffers stays empty on detach');

      URL.revokeObjectURL(url);
      assert(true, 'revokeObjectURL(MediaSource) completed');
    }

    (async function() {
      const summary = await window.runTests(suite_media_source_basic, 'media-source-basic');
      window.testResults = summary;
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
