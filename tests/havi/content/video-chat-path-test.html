<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Video Chat Path Test</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Video Chat Path Test</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>
  <script>
    function frameChunk(payload) {
      const out = new Uint8Array(4 + payload.length);
      const dv = new DataView(out.buffer);
      dv.setUint32(0, payload.length, true);
      out.set(payload, 4);
      return out;
    }

    function concatArrays(parts) {
      let len = 0;
      for (const p of parts) len += p.length;
      const out = new Uint8Array(len);
      let off = 0;
      for (const p of parts) {
        out.set(p, off);
        off += p.length;
      }
      return out;
    }

    class ChunkParser {
      constructor(onChunk) {
        this.buf = new Uint8Array(0);
        this.onChunk = onChunk;
      }
      push(bytes) {
        const merged = new Uint8Array(this.buf.length + bytes.length);
        merged.set(this.buf, 0);
        merged.set(bytes, this.buf.length);
        this.buf = merged;

        while (this.buf.length >= 4) {
          const dv = new DataView(this.buf.buffer, this.buf.byteOffset, this.buf.byteLength);
          const len = dv.getUint32(0, true);
          if (this.buf.length < 4 + len) return;
          const chunk = this.buf.slice(4, 4 + len);
          this.buf = this.buf.slice(4 + len);
          this.onChunk(chunk);
        }
      }
    }

    async function waitOpen(socket, name) {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error(name + ' onopen timeout')), 10000);
        if (socket.readyState === 1) {
          clearTimeout(timeout);
          resolve();
          return;
        }
        socket.onopen = () => { clearTimeout(timeout); resolve(); };
        socket.onerror = () => { clearTimeout(timeout); reject(new Error(name + ' onerror')); };
      });
    }

    async function suite_video_chat_path() {
      const source = window.source;
      const streamRepo = source.client;
      assert(source !== null, 'window.source exists');
      assertEqual(source.kind, 'remote', 'window.source.kind is remote for transport-backed video chat path');
      assert(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function',
          'navigator.mediaDevices.getUserMedia exists');
      assert(typeof window.MediaRecorder === 'function', 'MediaRecorder is exposed');
      assert(typeof window.MediaSource === 'function', 'MediaSource is exposed');
      assert(MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E"'),
          'MediaSource accepts MP4/H.264');

      log('--- local srcObject preview path ---');
      let localStream;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false,
        });
        log('PASS: getUserMedia(video) resolved');
      } catch (e) {
        localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: false });
        log('PASS: getUserMedia(video:false,audio:false) fallback resolved');
      }

      const localVideo = document.createElement('video');
      localVideo.autoplay = true;
      localVideo.muted = true;
      localVideo.playsInline = true;
      localVideo.srcObject = localStream;
      assert(localVideo.srcObject === localStream, 'video.srcObject stores MediaStream');

      log('--- stream framing over StreamPub/StreamSub ---');
      const group = document.packet.group;
      const app = document.packet.app;
      const prefix = '//' + group + '/' + app + '/live/chat-path-' + Date.now();

      const keyPacket = await streamRepo.get('//' + group + '/' + app + '/testkey');
      const signingKey = keyPacket.text();
      assert(signingKey.startsWith('&.'), 'signing key loaded');

      const streamSub = streamRepo.streamSub(prefix);
      await waitOpen(streamSub, 'streamSub');
      assertEqual(streamSub.readyState, 1, 'streamSub readyState OPEN');

      const streamPub = streamRepo.streamPub(prefix, { key: signingKey });
      await waitOpen(streamPub, 'streamPub');
      assertEqual(streamPub.readyState, 1, 'streamPub readyState OPEN');

      const expected1 = new TextEncoder().encode('alpha');
      const expected2 = new TextEncoder().encode('beta-012345');
      const wire = concatArrays([frameChunk(expected1), frameChunk(expected2)]);

      let sent = 0;
      const split = [1, 2, 3, 1, 4, 7, 2, 9];
      for (const n of split) {
        if (sent >= wire.length) break;
        const end = Math.min(sent + n, wire.length);
        await streamPub.write(wire.slice(sent, end));
        sent = end;
      }
      if (sent < wire.length) {
        await streamPub.write(wire.slice(sent));
      }
      streamPub.finishSegment();
      streamPub.close();
      log('PASS: framed bytes written to StreamPub, segment finished, and stream closed');

      await new Promise((resolve) => setTimeout(resolve, 500));
      const storedPacket = await streamRepo.get(prefix);
      const received = [];
      const parser = new ChunkParser((chunk) => received.push(chunk));
      parser.push(new Uint8Array(storedPacket.arrayBuffer()));

      assertEqual(received.length, 2, 'parser reconstructed two framed chunks');
      const dec = new TextDecoder();
      if (received.length >= 2) {
        assertEqual(dec.decode(received[0]), 'alpha', 'first payload matches');
        assertEqual(dec.decode(received[1]), 'beta-012345', 'second payload matches');
      }

      streamSub.close();
      for (const track of localStream.getTracks()) track.stop();
    }

    (async function() {
      const summary = await window.runTests(suite_video_chat_path, 'video-chat-path');
      window.testResults = summary;
      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!' : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
