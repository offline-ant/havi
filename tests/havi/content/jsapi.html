<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI JS API Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI JS API Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <!-- Load shared utilities -->
  <script src="test-utils.js"></script>

  <!-- Inline test suite -->
  <script>
    async function suite_jsapi() {
        const source = window.source;
        const client = source.client;

        log('--- committed source tests ---');
        assert(source !== null, 'window.source exists');
        assert(source.client !== null, 'window.source.client exists');
        assertEqual(source.kind, 'repo', 'window.source.kind is repo for local hppr page');
        assert(source.authority === null || typeof source.authority === 'string', 'window.source.authority is null or string');
        assertEqual(typeof window.havi, 'undefined', 'window.havi is removed from ordinary pages');
        assertEqual(typeof window.ring0, 'undefined', 'window.ring0 is removed from the Window surface');

        log('--- document.packet tests ---');
        assert(document.packet !== null, 'document.packet exists');
        assertEqual(document.packet.type, 'Seal', 'document.packet.type is Seal');
        assertContains(document.packet.hash, 'S.', 'document.packet.hash starts with S.');
        assert(document.packet.coordinate !== null, 'document.packet.coordinate exists');
        assert(document.packet.sealBy !== null, 'document.packet.sealBy exists');
        assert(document.packet.group !== null, 'document.packet.group exists');
        assert(document.packet.app !== null, 'document.packet.app exists');
        assert(document.packet.location !== null, 'document.packet.location exists');
        assert(typeof document.packet.dataLength === 'number', 'document.packet.dataLength is number');

        const group = document.packet.group;
        const app = document.packet.app;
        const coordinate = document.packet.coordinate;

        log('--- packet.json() tests ---');
        const testObj = { test: 'value', number: 42, nested: { a: 1 } };
        await client.add({
            headers: ['Location: user/json-test.json', 'Content-Type: application/json'],
            data: JSON.stringify(testObj),
        });

        const jsonPacket = await client.get('//' + group + '/' + app + '/user/json-test.json');
        assert(jsonPacket !== null, 'json test packet exists');
        const parsed = await jsonPacket.json();
        assertEqual(typeof parsed, 'object', 'json() returns object type');
        assertEqual(parsed.test, 'value', 'json() parsed string field');
        assertEqual(parsed.number, 42, 'json() parsed number field');
        assertEqual(parsed.nested.a, 1, 'json() parsed nested field');

        await client.add({ headers: ['Location: user/invalid-json.txt'], data: 'not valid json {' });
        const badPacket = await client.get('//' + group + '/' + app + '/user/invalid-json.txt');
        let jsonError = null;
        try { await badPacket.json(); } catch (e) { jsonError = e; }
        assert(jsonError !== null, 'json() rejects invalid JSON');

        log('--- packet.raw() tests ---');
        const rawTestData = 'raw test data';
        await client.add({ headers: ['Location: user/raw-test'], data: rawTestData });
        const rawPacket = await client.get('//' + group + '/' + app + '/user/raw-test');
        assert(rawPacket !== null, 'raw test packet exists');
        const raw = rawPacket.raw();
        assert(raw instanceof ArrayBuffer, 'raw() returns ArrayBuffer');
        assert(raw.byteLength > 0, 'raw() ArrayBuffer has content');
        const dataBytes = new TextEncoder().encode(rawTestData);
        assert(raw.byteLength > dataBytes.length, 'raw() includes more than just data');
        const view = new Uint8Array(raw);
        const startsWithMark = view[0] === 0xF0 && view[1] === 0x9F && view[2] === 0x96 && view[3] === 0xA7;
        assert(startsWithMark, 'raw() starts with packet markline');

        log('--- add() and get() tests ---');
        const testData = 'test data ' + Date.now();
        const hashes = await client.add({ headers: ['Location: user/test-item'], data: testData });
        assert(Array.isArray(hashes), 'add() returns array of hashes');
        assert(hashes.length > 0, 'add() returns at least one hash');
        assert(hashes[0].match(/^[SBP]\./), 'add() hash starts with type prefix');
        const packet = await client.get('//' + group + '/' + app + '/user/test-item');
        assert(packet !== null, 'get() returns packet');
        const body = (await packet.text()).trim();
        assertEqual(body, testData, 'get() returns correct data');

        log('--- EnvelopeHpprClient tests ---');
        const env = client.envelope();
        assertEqual(typeof client.endpoint, 'undefined', 'HpprClient.endpoint is removed from the ordinary surface');
        assertEqual(env.endpoint, null, 'EnvelopeHpprClient.endpoint is null for repo-backed committed sources');
        const envGet = await env.get('//' + group + '/' + app + '/user/test-item');
        assert(envGet.value !== null, 'env.get() returns HpprResult with value');
        assert(envGet.requestEnvelope !== null, 'env.get() has requestEnvelope');
        const envList = await env.list('//' + group + '/' + app + '/user/');
        assert(Array.isArray(envList.value), 'env.list() value is array');

        log('--- store() tests ---');
        const packetToStore = await client.get('//' + group + '/' + app + '/user/test-item');
        assert(packetToStore !== null, 'have packet to store');
        const storeHashes = await client.store(packetToStore);
        assert(Array.isArray(storeHashes), 'store() returns array of hashes');
        assert(storeHashes.length > 0, 'store() returns at least one hash');
        assert(storeHashes[0].match(/^[SBP]\./), 'store() hash starts with type prefix');

        log('--- list() tests ---');
        await client.add({ headers: ['Location: user/list-test'], data: 'for listing' });
        const entries = await client.list('//' + group + '/' + app + '/user/');
        assert(Array.isArray(entries), 'list() returns array');
        assert(entries.length > 0, 'list() returns entries');

        log('--- headers() tests ---');
        const headerLines = await client.headers(coordinate);
        assert(Array.isArray(headerLines), 'headers() returns array');
        assert(headerLines.length > 0, 'headers() returns header lines');
        assertContains(headerLines[0], '🖧:', 'headers() first line is markline');

        log('--- detach() surface tests ---');
        assertEqual(typeof client.detach, 'function', 'detach() remains exposed on HpprClient');
    }

    // Auto-run suite
    (async function() {
      const summary = await window.runTests(suite_jsapi, 'jsapi');

      window.testResults = summary;

      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
