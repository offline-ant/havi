<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI SVG Phase 5 textLength spacing</title>
  <style>
    body { font-family: monospace; margin: 16px; }
    #status.pass { color: green; }
    #status.fail { color: red; }
    #results { white-space: pre-wrap; border: 1px solid #ccc; padding: 12px; background: #fafafa; }
    #host { position: absolute; left: 0; top: 0; visibility: visible; }
  </style>
</head>
<body>
  <div id="status">Running...</div>
  <pre id="results"></pre>
  <div id="host"></div>

  <script src="test-utils.js"></script>
  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    function raf() { return new Promise(resolve => requestAnimationFrame(() => resolve())); }
    async function settleLayout() { await raf(); await raf(); }

    async function suite_svg_phase5_textlength_spacing() {
      const host = document.getElementById('host');
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('width', '520');
      svg.setAttribute('height', '180');
      svg.style.display = 'block';

      function makeText(id, y, attrs) {
        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('id', id);
        text.setAttribute('font-size', '24');
        text.setAttribute('x', '20');
        text.setAttribute('y', String(y));
        text.textContent = 'ABCD';
        for (const [name, value] of Object.entries(attrs)) {
          text.setAttribute(name, value);
        }
        svg.append(text);
        return text;
      }

      const control = makeText('control', 50, {});
      const adjusted = makeText('adjusted', 110, { textLength: '220', lengthAdjust: 'spacing' });
      const defaultAdjusted = makeText('defaultAdjusted', 160, { textLength: '220' });
      host.append(svg);
      await settleLayout();

      const controlRect = control.getBoundingClientRect();
      const adjustedRect = adjusted.getBoundingClientRect();
      const defaultRect = defaultAdjusted.getBoundingClientRect();

      assert(adjustedRect.width > controlRect.width + 80, 'lengthAdjust=spacing expands rendered text width in layout');
      assert(defaultRect.width > controlRect.width + 80, 'textLength defaults to spacing adjustment in layout');
    }

    (async function() {
      const summary = await window.runTests(suite_svg_phase5_textlength_spacing, 'svg-phase5-textlength-spacing');
      window.testResults = summary;
      const status = document.getElementById('status');
      status.className = summary.failed === 0 ? 'pass' : 'fail';
      status.textContent = summary.failed === 0 ? 'All tests passed!' : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
