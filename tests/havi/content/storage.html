<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Web Storage Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Web Storage Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <!-- Load shared utilities -->
  <script src="test-utils.js"></script>

  <!-- Inline test suite -->
  <script>
    async function suite_storage() {
        // --- localStorage tests ---
        log('--- localStorage tests ---');
        assert(window.localStorage !== null && window.localStorage !== undefined,
               'localStorage is accessible');

        // Clear any prior state
        localStorage.clear();
        assertEqual(localStorage.length, 0, 'localStorage.length is 0 after clear');

        // setItem / getItem
        localStorage.setItem('hppr-test-key', 'hppr-test-value');
        assertEqual(localStorage.getItem('hppr-test-key'), 'hppr-test-value',
                     'localStorage.getItem returns stored value');
        assertEqual(localStorage.length, 1, 'localStorage.length is 1 after setItem');

        // Overwrite
        localStorage.setItem('hppr-test-key', 'updated');
        assertEqual(localStorage.getItem('hppr-test-key'), 'updated',
                     'localStorage.setItem overwrites existing key');
        assertEqual(localStorage.length, 1, 'localStorage.length unchanged after overwrite');

        // Multiple keys
        localStorage.setItem('key2', 'val2');
        assertEqual(localStorage.length, 2, 'localStorage.length is 2 after second key');

        // key()
        const k0 = localStorage.key(0);
        const k1 = localStorage.key(1);
        assert(k0 !== null, 'localStorage.key(0) returns a key');
        assert(k1 !== null, 'localStorage.key(1) returns a key');
        assertEqual(localStorage.key(2), null, 'localStorage.key(2) returns null (out of range)');

        // removeItem
        localStorage.removeItem('key2');
        assertEqual(localStorage.length, 1, 'localStorage.length is 1 after removeItem');
        assertEqual(localStorage.getItem('key2'), null, 'removed key returns null');

        // clear
        localStorage.clear();
        assertEqual(localStorage.length, 0, 'localStorage.length is 0 after final clear');

        // --- sessionStorage tests ---
        log('--- sessionStorage tests ---');
        assert(window.sessionStorage !== null && window.sessionStorage !== undefined,
               'sessionStorage is accessible');

        sessionStorage.clear();
        assertEqual(sessionStorage.length, 0, 'sessionStorage.length is 0 after clear');

        sessionStorage.setItem('session-key', 'session-value');
        assertEqual(sessionStorage.getItem('session-key'), 'session-value',
                     'sessionStorage.getItem returns stored value');
        assertEqual(sessionStorage.length, 1, 'sessionStorage.length is 1 after setItem');

        sessionStorage.removeItem('session-key');
        assertEqual(sessionStorage.length, 0, 'sessionStorage.length is 0 after removeItem');

        // --- origin isolation test ---
        log('--- origin isolation tests ---');
        // Verify storage is scoped to the HPPR origin (group+app).
        // We store a value and confirm it persists within this page context.
        localStorage.setItem('origin-marker', document.packet.group + '/' + document.packet.app);
        assertEqual(localStorage.getItem('origin-marker'),
                     document.packet.group + '/' + document.packet.app,
                     'localStorage scoped to hppr origin');

        localStorage.clear();
        sessionStorage.clear();
    }

    // Auto-run suite
    (async function() {
      const summary = await window.runTests(suite_storage, 'storage');

      window.testResults = summary;

      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
