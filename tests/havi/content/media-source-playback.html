<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MediaSource Playback Test</title>
</head>
<body>
  <pre id="results"></pre>
  <script src="test-utils.js"></script>
  <script>
    function waitEvent(target, name, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(name + ' timeout'));
        }, timeoutMs);
        target.addEventListener(name, function handler(event) {
          clearTimeout(timer);
          target.removeEventListener(name, handler);
          resolve(event);
        });
      });
    }

    function waitFor(predicate, timeoutMs, label) {
      const start = Date.now();
      return new Promise((resolve, reject) => {
        function tick() {
          if (predicate()) {
            resolve();
            return;
          }
          if (Date.now() - start > timeoutMs) {
            reject(new Error(label + ' timeout'));
            return;
          }
          setTimeout(tick, 50);
        }
        tick();
      });
    }

    async function suite_media_source_playback() {
      log('--- load valid fragmented MP4 bytes through HPPR ---');
      assert(window.home, 'window.home exists for HPPR byte loading');
      assert(document.packet, 'document.packet exists for current page');

      const group = document.packet.group;
      const app = document.packet.app;
      const packet = await window.home.get('//' + group + '/' + app + '/media-source-h264-frag.mp4');
      const mp4Bytes = new Uint8Array(packet.arrayBuffer());
      assert(mp4Bytes.length > 0, 'fixture bytes loaded from HPPR');

      log('--- attach MediaSource and append valid fMP4 clip ---');
      const mediaSource = new MediaSource();
      const url = URL.createObjectURL(mediaSource);
      const video = document.createElement('video');
      video.muted = true;
      video.autoplay = false;
      video.playsInline = true;
      document.body.appendChild(video);

      const opened = waitEvent(mediaSource, 'sourceopen');
      video.src = url;
      await opened;
      assertEqual(mediaSource.readyState, 'open', 'MediaSource opens on attach');

      const sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1"');
      const loadedMetadata = waitEvent(video, 'loadedmetadata', 10000);
      const loadedData = waitEvent(video, 'loadeddata', 10000);
      const canPlay = waitEvent(video, 'canplay', 10000);
      const appendEnd = waitEvent(sourceBuffer, 'updateend', 10000);
      sourceBuffer.appendBuffer(mp4Bytes);
      await appendEnd;

      assertEqual(sourceBuffer.updating, false, 'appendBuffer completes for valid fMP4');
      assert(sourceBuffer.buffered.length >= 1, 'valid append produces buffered range');
      if (sourceBuffer.buffered.length >= 1) {
        assert(sourceBuffer.buffered.end(0) > 0.5, 'buffered range has playable duration');
      }

      const ended = waitEvent(mediaSource, 'sourceended', 10000);
      mediaSource.endOfStream();
      await ended;
      assertEqual(mediaSource.readyState, 'ended', 'endOfStream closes appended clip');

      await loadedMetadata;
      await loadedData;
      await canPlay;
      assert(video.videoWidth > 0, 'videoWidth populated from decoded metadata');
      assert(video.videoHeight > 0, 'videoHeight populated from decoded metadata');
      assert(video.duration > 0, 'video duration populated after prepare');
      assert(video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA,
        'video readyState advances after valid append');

      log('--- play and observe decode/present path ---');
      const playing = waitEvent(video, 'playing', 10000);
      const endedPlayback = waitEvent(video, 'ended', 10000).catch(() => null);
      const playResult = video.play();
      if (playResult && typeof playResult.then === 'function') {
        await playResult;
      }
      await playing;
      assert(!video.paused, 'video enters playing state');

      await Promise.race([
        waitFor(() => video.currentTime > 0, 10000, 'playback advance'),
        endedPlayback,
      ]);
      assert(video.currentTime > 0 || video.ended,
        'currentTime advances or playback reaches ended for valid MSE playback');

      video.pause();
      URL.revokeObjectURL(url);
      assert(true, 'valid fragmented MP4 playback completed');
    }

    (async function() {
      const summary = await window.runTests(suite_media_source_playback, 'media-source-playback');
      window.testResults = summary;
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
