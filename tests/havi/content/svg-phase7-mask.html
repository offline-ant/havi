<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI SVG Phase 7 masks</title>
  <style>
    html, body { margin: 0; background: white; }
    svg { display: block; }
  </style>
</head>
<body>
  <svg width="360" height="180" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="bbox-mask"
            maskUnits="userSpaceOnUse"
            maskContentUnits="userSpaceOnUse"
            x="20" y="20" width="70" height="100">
        <rect x="20" y="20" width="70" height="100" fill="#fff"/>
      </mask>
    </defs>

    <rect x="20" y="20" width="140" height="100" fill="#0066ff" mask="url(#bbox-mask)"/>
  </svg>

  <script>
    window.phase7MaskSamples = {
      bboxMaskVisible: { point: [50, 70], expected: [0, 102, 255] },
      bboxMaskHidden: { point: [130, 70], expected: [255, 255, 255] }
    };
    window.phase7MaskReady = true;
  </script>
</body>
</html>
