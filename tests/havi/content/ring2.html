<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Ring2 Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Ring2 Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <!-- Load shared utilities -->
  <script src="test-utils.js"></script>

  <!-- Inline test suite -->
  <script>
    async function suite_ring2() {
        log('--- window.route.anyone existence tests (removed) ---');
        assertEqual(window.route.anyone, undefined, 'window.route.anyone is undefined (removed from API)');

        log('--- window.route existence tests (routed with identity) ---');
        assert(window.route !== null, 'window.route exists (identity configured)');

        log('--- window.route.hello() tests ---');
        const greeting = await window.route.hello();
        assertEqual(typeof greeting, 'object', 'hello() returns object');
        assert(typeof greeting.repoName === 'string' && greeting.repoName.length > 0, 'hello().repoName is present');
        assert(typeof greeting.sessionId === 'string' && greeting.sessionId.length > 0, 'hello().sessionId is present');
        assert(typeof greeting.verifyingKey === 'string' && greeting.verifyingKey.length > 0, 'hello().verifyingKey is present');

        log('--- window.route read tests ---');
        const group = document.packet.group;
        const app = document.packet.app;
        const packet = await window.route.get('//' + group + '/' + app + '/index.html');
        assert(packet !== null, 'ring2.get() returns packet');
        assert(packet.type === 'Seal' || packet.type === 'Plex', 'ring2 packet has valid type');

        log('--- window.route list tests ---');
        const entries = await window.route.list('//' + group + '/' + app + '/');
        assert(Array.isArray(entries), 'ring2.list() returns array');
        assert(entries.length > 0, 'ring2.list() has entries');
        const hasIndexHtml = entries.includes('index.html') || entries.includes('index.html/');
        assert(hasIndexHtml, 'ring2.list() includes index.html');

        log('--- window.home vs window.route tests ---');
        assert(window.home !== null, 'window.home exists');
        assert(window.home.endpoint !== window.route.endpoint, 'home repo and route repo have different endpoints');
    }

    // Auto-run suite
    (async function() {
      const summary = await window.runTests(suite_ring2, 'ring2');

      window.testResults = summary;

      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
