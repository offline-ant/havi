<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI Routed Source Test Suite</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>HAVI Routed Source Test Suite</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <script src="test-utils.js"></script>
  <script>
    async function suite_ring2() {
        const source = window.source;
        assert(source !== null, 'window.source exists on routed page');
        assertEqual(source.kind, 'remote', 'window.source.kind is remote');
        assertEqual(window.havi, null, 'window.havi is null on ordinary routed page');
        assertEqual(typeof window.ring0, 'undefined', 'window.ring0 stays removed');

        const group = document.packet.group;
        const app = document.packet.app;
        const client = source.client;

        log('--- source client hello() tests ---');
        const greeting = await client.hello();
        assertEqual(typeof greeting, 'object', 'hello() returns object');
        assert(typeof greeting.repoName === 'string' && greeting.repoName.length > 0, 'hello().repoName is present');
        assert(typeof greeting.sessionId === 'string' && greeting.sessionId.length > 0, 'hello().sessionId is present');
        assert(typeof greeting.verifyingKey === 'string' && greeting.verifyingKey.length > 0, 'hello().verifyingKey is present');

        log('--- source client read tests ---');
        const packet = await client.get('//' + group + '/' + app + '/index.html');
        assert(packet !== null, 'source.client.get() returns packet');
        assert(packet.type === 'Seal' || packet.type === 'Plex', 'packet has valid type');

        log('--- source client list tests ---');
        const entries = await client.list('//' + group + '/' + app + '/');
        assert(Array.isArray(entries), 'source.client.list() returns array');
        assert(entries.length > 0, 'source.client.list() has entries');
        const hasIndexHtml = entries.includes('index.html') || entries.includes('index.html/');
        assert(hasIndexHtml, 'source.client.list() includes index.html');

        log('--- source authority tests ---');
        assert(source.authority !== null, 'window.source.authority exists on routed page');
    }

    (async function() {
      const summary = await window.runTests(suite_ring2, 'ring2');
      window.testResults = summary;
      document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
      document.getElementById('status').textContent = summary.failed === 0
        ? 'All tests passed!'
        : 'Some tests failed';
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
