<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Baked HPPR Media Test</title>
</head>
<body>
  <pre id="results"></pre>
  <script src="test-utils.js"></script>
  <script>
    function waitEvent(target, name, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(name + ' timeout')), timeoutMs);
        target.addEventListener(name, function handler(event) {
          clearTimeout(timer);
          target.removeEventListener(name, handler);
          resolve(event);
        });
      });
    }

    function waitFor(predicate, timeoutMs, label) {
      const start = Date.now();
      return new Promise((resolve, reject) => {
        function tick() {
          if (predicate()) {
            resolve();
            return;
          }
          if (Date.now() - start > timeoutMs) {
            reject(new Error(label + ' timeout'));
            return;
          }
          setTimeout(tick, 50);
        }
        tick();
      });
    }

    async function suite_media_baked_hppr() {
      log('--- direct hppr:// baked playback path ---');
      assert(document.packet, 'document.packet exists for baked hppr test page');

      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';
      document.body.appendChild(video);

      const mediaUrl = 'hppr://' + document.packet.group + '/' + document.packet.app +
        '/media-source-h264-frag.mp4';
      const loadedMetadata = waitEvent(video, 'loadedmetadata');
      const loadedData = waitEvent(video, 'loadeddata');
      const canPlay = waitEvent(video, 'canplay');
      video.src = mediaUrl;
      video.load();

      await loadedMetadata;
      await loadedData;
      await canPlay;

      assert(video.currentSrc.startsWith('hppr://'),
        'relative baked media src resolves to hppr://');
      assert(video.videoWidth > 0, 'hppr baked playback loads video width');
      assert(video.videoHeight > 0, 'hppr baked playback loads video height');
      assert(video.duration > 0 || video.duration === Infinity,
        'hppr baked playback loads duration');
      assert(video.buffered.length >= 1, 'hppr baked playback exposes buffered ranges');
      if (video.buffered.length >= 1) {
        assert(video.buffered.end(0) > 0.5, 'hppr baked playback buffers playable data');
      }

      log('--- play baked hppr media through shared custom session ---');
      const playing = waitEvent(video, 'playing');
      const ended = waitEvent(video, 'ended').catch(() => null);
      const playResult = video.play();
      if (playResult && typeof playResult.then === 'function') {
        await playResult;
      }
      await playing;
      assert(!video.paused, 'hppr baked playback enters playing state');

      await Promise.race([
        waitFor(() => video.currentTime > 0, 10000, 'baked playback advance'),
        ended,
      ]);
      assert(video.currentTime > 0 || video.ended,
        'hppr baked playback advances or reaches ended');

      video.pause();
      assert(true,
        'direct hppr baked media playback succeeded without delegated-native fallback');
    }

    (async function() {
      const summary = await window.runTests(suite_media_baked_hppr, 'media-baked-hppr');
      window.testResults = summary;
      document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
