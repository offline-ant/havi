<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test: Basic &lt;x&gt; Element</title>
  <style>
    body { font-family: monospace; margin: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Basic &lt;x&gt; Element Test</h1>
  <div id="status">Loading...</div>
  <pre id="results"></pre>

  <h2>Test Element</h2>
  <x id="test-x" src="//test/app/embed.html" width="400" height="200"></x>

  <script src="test-utils.js"></script>
  <script>
    async function suite_xelement_basic() {
        const x = document.getElementById('test-x');

        log('--- Element existence tests ---');
        assert(x !== null, 'Element created');
        assertEqual(x.constructor.name, 'HTMLXFrame', 'Is HTMLXFrame');
        assert(x.src !== undefined, 'Has src attribute');
        assert(typeof x.trustParent === 'boolean', 'Has trustParent attribute');

        log('--- Load event test ---');
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                reject(new Error('Load timeout after 5s'));
            }, 5000);

            x.addEventListener('load', () => {
                clearTimeout(timeout);
                resolve();
            });

            x.addEventListener('error', (e) => {
                clearTimeout(timeout);
                reject(new Error('Error event: ' + (e.message || 'unknown')));
            });
        });
        log('PASS: Load event fires');
    }

    (async function() {
        const summary = await window.runTests(suite_xelement_basic, 'x-element-basic');
        window.testResults = summary;

        document.getElementById('status').className = summary.failed === 0 ? 'pass' : 'fail';
        document.getElementById('status').textContent = summary.failed === 0
            ? 'All tests passed!'
            : 'Some tests failed';
        document.getElementById('results').textContent = summary.results.join('\n');
    })();
  </script>
</body>
</html>
