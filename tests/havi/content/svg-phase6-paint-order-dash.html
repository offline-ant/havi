<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HAVI SVG Phase 6 paint-order and dashes</title>
  <style>
    html, body { margin: 0; background: white; }
    svg { display: block; }
  </style>
</head>
<body>
  <svg width="340" height="240" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="20" width="100" height="100" fill="#ff0000" stroke="#0000ff" stroke-width="30"/>
    <rect x="160" y="20" width="100" height="100" fill="#ff0000" stroke="#0000ff" stroke-width="30" paint-order="stroke fill"/>

    <path d="M 20 180 L 220 180"
          fill="none"
          stroke="#000000"
          stroke-width="20"
          stroke-linecap="butt"
          stroke-dasharray="40 20"
          stroke-dashoffset="10"/>
  </svg>

  <script>
    window.phase6Samples = {
      defaultPaintOrderEdge: { point: [30, 70], expected: [0, 0, 255] },
      strokeFillPaintOrderEdge: { point: [170, 70], expected: [255, 0, 0] },
      dashVisibleSegmentA: { point: [35, 180], expected: [0, 0, 0] },
      dashGapSegment: { point: [60, 180], expected: [255, 255, 255] },
      dashVisibleSegmentB: { point: [85, 180], expected: [0, 0, 0] }
    };
    window.phase6Ready = true;
  </script>
</body>
</html>
