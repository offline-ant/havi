<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>image grid benchmark</title>
<style>
  :root {
    color-scheme: light;
  }
  body {
    margin: 0;
    padding: 20px;
    font: 14px/1.4 system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  h1 {
    margin: 0 0 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 10px;
  }
  .tile {
    aspect-ratio: 1;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 8px 20px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body>
  <h1>Image grid benchmark</h1>
  <p>Dense colored tiles approximate many retained image and box primitives without external assets.</p>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    for (let i = 0; i < 360; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const hue = (i * 29) % 360;
      const hue2 = (hue + 48) % 360;
      tile.style.background = `linear-gradient(135deg, hsl(${hue} 70% 62%), hsl(${hue2} 72% 48%))`;
      grid.appendChild(tile);
    }
  </script>
</body>
</html>
