<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      background: white;
    }
    .scene {
      position: relative;
      width: 280px;
      height: 240px;
      margin: 20px;
      perspective: 180px;
      perspective-origin: 50px 50px;
      background: white;
    }
    .outer {
      position: absolute;
      left: 18px;
      top: 22px;
      width: 150px;
      height: 120px;
      overflow: hidden;
      border: 4px solid #000;
      transform: rotateY(50deg);
      transform-origin: 0 0;
      transform-style: preserve-3d;
      background: #fafafa;
    }
    .inner {
      position: absolute;
      left: 14px;
      top: 18px;
      width: 90px;
      height: 70px;
      overflow: hidden;
      border: 4px solid #000;
      transform: rotateX(-35deg) rotateY(20deg);
      transform-origin: 0 0;
      background: #fff;
    }
    .stripe {
      position: absolute;
      left: -12px;
      top: 8px;
      width: 180px;
      height: 40px;
      background: repeating-linear-gradient(90deg, #000 0 10px, #ff0 10px 20px);
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="outer">
      <div class="inner">
        <div class="stripe"></div>
      </div>
    </div>
  </div>
</body>
</html>
