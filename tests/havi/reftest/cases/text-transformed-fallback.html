<!doctype html>
<style>
html,body{margin:0;background:#1a1e26;color:#eef3fa;font:16px sans-serif}
.outer{position:absolute;left:40px;top:40px;width:260px;padding:16px;background:#223142;border-radius:12px}
.transformed{transform:scale(1.02);background:#31465f;padding:8px;margin:8px 0;border-radius:4px}
</style>
<div class="outer">
  <p>Direct text above transform</p>
  <div class="transformed">
    <p>Text inside a scaled transform</p>
    <p style="text-decoration:underline">Underlined inside transform</p>
  </div>
  <p>Direct text below transform</p>
</div>
