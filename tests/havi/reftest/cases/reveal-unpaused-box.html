<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../../../../site/presentation/reset.css">
  <link rel="stylesheet" href="../../../../../site/presentation/reveal.css">
  <style>
    html, body {
      background: #000;
    }
    .marker {
      width: 120px;
      height: 80px;
      background: #f00;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section><div class="marker"></div></section>
    </div>
  </div>
  <script src="../../../../../site/presentation/reveal.js"></script>
  <script>
    Reveal.initialize({ controls: false, progress: false, slideNumber: false, hash: false });
    Reveal.on('ready', () => Reveal.togglePause(false));
  </script>
</body>
</html>
