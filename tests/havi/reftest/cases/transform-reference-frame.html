<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: white; }
  .stage {
    position: relative;
    width: 240px;
    height: 220px;
    margin: 20px;
    background: rgb(240, 240, 240);
  }
  .rotator {
    position: absolute;
    left: 100px;
    top: 30px;
    width: 120px;
    height: 40px;
    background: rgb(40, 90, 220);
    transform-origin: top left;
    transform: rotate(90deg);
  }
  .mover {
    position: absolute;
    left: 20px;
    top: 140px;
    width: 50px;
    height: 50px;
    background: rgb(220, 80, 80);
    transform: translate(90px, -20px);
  }
</style>
<div class="stage">
  <div class="rotator"></div>
  <div class="mover"></div>
</div>
