<!doctype html>
<style>
html,body{margin:0;background:#1a1e26;color:#eef3fa;font:20px sans-serif}
.box{position:absolute;left:20px;top:20px;width:300px;padding:12px;background:#223142;border-radius:8px}
.underline{text-decoration:underline}
.line-through{text-decoration:line-through}
.both{text-decoration:underline line-through}
.bg{background:#31465f}
</style>
<div class="box">
  <p class="underline">Underline decoration</p>
  <p class="line-through">Line-through decoration</p>
  <p class="both bg">Both decorations with background</p>
  <p>Plain text for comparison</p>
</div>
