<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: white; }
  .stage {
    position: relative;
    width: 200px;
    height: 120px;
    margin: 30px;
    background: white;
  }
  .group {
    position: relative;
    width: 160px;
    height: 100px;
    opacity: 0.5;
  }
  .left, .right {
    position: absolute;
    background: black;
  }
  .left {
    left: 0;
    top: 0;
    width: 50px;
    height: 80px;
  }
  .right {
    left: 70px;
    top: 20px;
    width: 60px;
    height: 60px;
  }
</style>
<div class="stage">
  <div class="group">
    <div class="left"></div>
    <div class="right"></div>
  </div>
</div>
