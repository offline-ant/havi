<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      background: white;
    }
    .scene {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 20px;
      perspective: 140px;
      perspective-origin: 40px 40px;
      background: white;
    }
    .clip {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 120px;
      height: 120px;
      overflow: hidden;
      transform: rotateY(55deg) rotateX(18deg);
      transform-style: preserve-3d;
      transform-origin: 0 0;
      background: #f0f0f0;
      border: 4px solid #000;
    }
    .content {
      position: absolute;
      left: -10px;
      top: 12px;
      width: 200px;
      height: 78px;
      background: linear-gradient(90deg, #d00 0 33%, #0a0 33% 66%, #06c 66% 100%);
      border-top: 8px solid #000;
      border-bottom: 8px solid #000;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="clip">
      <div class="content"></div>
    </div>
  </div>
</body>
</html>
