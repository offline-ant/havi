<!doctype html>
<style>
html,body{margin:0;background:#121722}
.panel{position:absolute;left:32px;top:32px;width:220px;height:160px;border-radius:18px;overflow:hidden;background:#1a2634}
.tile{position:absolute;width:24px;height:24px;background:#1a2634}
.white{position:absolute;width:12px;height:12px;background:#fff}
</style>
<div class=panel>
<script>
for(let y=0;y<160;y+=24){
  for(let x=0;x<220;x+=24){
    document.write(`<div class="tile" style="left:${x}px;top:${y}px"><div class="white" style="left:0;top:0"></div><div class="white" style="left:12px;top:12px"></div></div>`)
  }
}
</script>
</div>
