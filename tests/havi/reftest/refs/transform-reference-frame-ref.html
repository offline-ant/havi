<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: white; }
  .stage {
    position: relative;
    width: 240px;
    height: 220px;
    margin: 20px;
    background: rgb(240, 240, 240);
  }
  .rotator-ref {
    position: absolute;
    left: 60px;
    top: 30px;
    width: 40px;
    height: 120px;
    background: rgb(40, 90, 220);
  }
  .mover-ref {
    position: absolute;
    left: 110px;
    top: 120px;
    width: 50px;
    height: 50px;
    background: rgb(220, 80, 80);
  }
</style>
<div class="stage">
  <div class="rotator-ref"></div>
  <div class="mover-ref"></div>
</div>
