<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:#191919;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.viewport{position:relative;width:100%;height:100%}
.slide{position:absolute;left:50%;top:50%;width:960px;height:700px;transform:translate(-50%,-50%) scale(0.955886);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:96px;line-height:1.1;margin:0 0 40px 0;font-weight:700}
p{font-size:56px;line-height:1.2;margin:0}
.slide-number{position:fixed;right:8px;bottom:8px;color:#fff;background:rgba(0,0,0,0.4);padding:2px 6px;font:16px system-ui,sans-serif}
</style>
</head>
<body>
<div class="viewport">
  <div class="slide">
    <h1>Reveal OK</h1>
    <p>one slide</p>
  </div>
</div>
<div class="slide-number">1</div>
</body>
</html>
