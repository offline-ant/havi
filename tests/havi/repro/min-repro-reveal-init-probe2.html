<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../site/presentation/reset.css">
<link rel="stylesheet" href="../../../../site/presentation/reveal.css">
<link rel="stylesheet" href="../../../../site/presentation/theme/black.css">
<style>html,body{margin:0;height:100%;background:#111;color:#fff;font:28px system-ui,sans-serif;white-space:pre-wrap}</style>
</head>
<body>
<div class="reveal"><div class="slides"><section><h1>Reveal Probe</h1><p>one slide</p></section></div></div>
<script src="../../../../site/presentation/reveal.js"></script>
<script>
Promise.resolve(Reveal.initialize({ hash: true, slideNumber: true }))
  .then(() => {
    const section = document.querySelector('section');
    const slides = document.querySelector('.slides');
    const s = getComputedStyle(section);
    const ss = getComputedStyle(slides);
    document.body.textContent = [
      'sectionClass=' + section.className,
      'display=' + s.display,
      'opacity=' + s.opacity,
      'transform=' + s.transform,
      'slidesTransform=' + ss.transform,
      'sectionRect=' + JSON.stringify(section.getBoundingClientRect().toJSON()),
      'slidesRect=' + JSON.stringify(slides.getBoundingClientRect().toJSON())
    ].join('\n');
  })
  .catch((e) => {
    document.body.textContent = 'init error: ' + e.name + ': ' + e.message;
  });
</script>
</body>
</html>
