[package]
name = "libhavi"
build = "build.rs"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
[lib]
name = "libhavi"
path = "lib.rs"
crate-type = ["rlib"]
[features]
# Note: Shell ports that disable libhavi default features must opt into any needed features explicitly.
default = ["clipboard", "js_jit"]
background_hang_monitor = ["sampler"]
sampler = []
bluetooth = ["bluetooth_traits", "dep:bluetooth", "constellation_traits/bluetooth", "script_traits/bluetooth", "script_bindings/bluetooth"]
clipboard = ["dep:arboard"]
crown = ["js/crown"]
debugmozjs = ["js/debugmozjs"]
dynamic_freetype = []
gamepad = ["embedder_traits/gamepad", "script_bindings/gamepad"]
glwindow = []
headless = []
jitspew = ["js/jitspew"]
js_backtrace = []
js_jit = ["js/jit"]
native-bluetooth = ["bluetooth/native-bluetooth"]
no-wgl = ["paint_api/no-wgl"]
openxr-api = []
profilemozjs = ["js/profilemozjs"]
refcell_backtrace = []
test-util = []
testbinding = ["script_bindings/testbinding"]
tracing = ["dep:tracing", "profile_traits/tracing", "script_bindings/tracing"]
vello = []
webgpu = ["constellation_traits/webgpu", "script_bindings/webgpu"]
webxr = ["glwindow", "headless", "openxr-api", "script_bindings/webxr"]
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)'] }

[dependencies]
accesskit = { workspace = true }
app_units = { workspace = true }
background_hang_monitor_api = { workspace = true }
base = { workspace = true }
bitflags = { workspace = true }
byteorder = { workspace = true }
cssparser = { workspace = true }
bluetooth = { path = "../bluetooth", optional = true }
bluetooth_traits = { workspace = true, optional = true }
canvas_traits = { workspace = true }
constellation_traits = { workspace = true }
crossbeam-channel = { workspace = true }
devtools_traits = { workspace = true }
dpi = { workspace = true }
bytes = "1"
embedder_traits = { workspace = true }
env_logger = { workspace = true }
euclid = { workspace = true }
fonts_traits = { workspace = true }
fonts = { path = "../fonts" }
html5ever = { workspace = true }
hppr-client = { workspace = true }
