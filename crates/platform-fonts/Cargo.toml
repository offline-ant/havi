[package]
name = "havi-platform-fonts"
version = "0.1.0"
edition = "2021"

[dependencies]
unicode-properties = "0.1"
unicode-script = "0.5"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys = "6"

[target.'cfg(target_os = "android")'.dependencies]
xml-rs = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
dwrote = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFNumber", "CFURL", "CFSet", "CFArray"] }
objc2-core-text = { version = "0.3", features = ["CTFontDescriptor", "CTFontManager", "CTFontTraits"] }
