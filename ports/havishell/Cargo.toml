[package]
name = "havishell"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "havishell"
path = "src/lib.rs"

[[bin]]
name = "havi"
path = "src/main.rs"

[features]
default = ["max_log_level", "embedded-services"]
embedded-services = ["pylon/embedded-services"]
crown = ["libservo/crown"]
debugmozjs = ["libservo/debugmozjs"]
jitspew = ["libservo/jitspew"]
js_backtrace = ["libservo/js_backtrace"]
js_jit = ["libservo/js_jit"]
max_log_level = ["log/release_max_level_info"]
native-bluetooth = ["libservo/native-bluetooth"]
profilemozjs = ["libservo/profilemozjs"]
refcell_backtrace = ["libservo/refcell_backtrace"]
webgpu = ["libservo/webgpu"]

[dependencies]
makepad-widgets = { path = "../../../makepad/widgets" }
libservo = { path = "../../components/servo", features = ["background_hang_monitor"], default-features = false }
url = "2"
log = "0.4"
keyboard-types = "0.8"
dpi = "0.1"
euclid = "0.22"
havi-protocols = { path = "../../havi-protocols" }
hppr-client = { workspace = true }
havi-render = { workspace = true }
havi-types = { workspace = true }
layout_api = { path = "../../components/shared/layout" }
paint_api = { path = "../../components/shared/paint" }
pylon = { path = "../../../hppr/pylon", default-features = false }
env_logger = "0.11"
anyhow = "1"
crossbeam-channel = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json = { workspace = true }
media = { path = "../../components/media/media-thread" }

[build-dependencies]
cc = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
libservo = { path = "../../components/servo", features = ["background_hang_monitor", "no-wgl"] }
