[package]
name = "havishell"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "havishell"
path = "src/lib.rs"

[[bin]]
name = "havi"
path = "src/main.rs"

[features]
default = ["max_log_level", "embedded-services"]
embedded-services = ["pylon/embedded-services"]
crown = ["libhavi/crown"]
debugmozjs = ["libhavi/debugmozjs"]
jitspew = ["libhavi/jitspew"]
js_backtrace = ["libhavi/js_backtrace"]
js_jit = ["libhavi/js_jit"]
max_log_level = ["log/release_max_level_info"]
native-bluetooth = ["libhavi/native-bluetooth"]
profilemozjs = ["libhavi/profilemozjs"]
refcell_backtrace = ["libhavi/refcell_backtrace"]

[dependencies]
makepad-widgets = { path = "../../../makepad/widgets" }
makepad-media = { path = "../../../havi-makepad/media", features = ["svt-av1"] }
libhavi = { package = "libhavi", path = "../../components/servo", features = ["background_hang_monitor"], default-features = false }
url = "2"
log = "0.4"
keyboard-types = "0.8"
dpi = "0.1"
euclid = "0.22"
hppr-client = { workspace = true }
hppr-packet = { workspace = true }
havi-render = { workspace = true }
havi-types = { workspace = true }
pylon = { path = "../../../hppr/pylon", default-features = false }
env_logger = "0.11"
anyhow = "1"
crossbeam-channel = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json = { workspace = true }
image = { workspace = true }
libc = "0.2"
webrender_api = { workspace = true }
rustc-hash = { workspace = true }
app_units = { workspace = true }
stylo = { workspace = true }

[build-dependencies]
cc = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
libhavi = { package = "libhavi", path = "../../components/servo", features = ["background_hang_monitor", "no-wgl"] }
