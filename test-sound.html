<script>
// Auto-detect support for each media element
function check(id, elId, type) {
  var st = document.getElementById('st-' + id);
  var el = document.getElementById(elId);
  if (!el) return;

  if (el.tagName === 'IMG') {
    el.onload = function() { st.textContent = el.naturalWidth + '×' + el.naturalHeight + ' ✓'; st.className = 'status ok'; };
    el.onerror = function() { st.textContent = 'not supported ✗'; st.className = 'status fail'; };
    if (el.complete && el.naturalWidth > 0) { el.onload(); }
  } else {
    // audio/video
    el.onloadeddata = function() {
      var info = type === 'video'
        ? el.videoWidth + '×' + el.videoHeight + ' ✓'
        : (el.duration ? el.duration.toFixed(1) + 's ✓' : '✓');
      st.textContent = info; st.className = 'status ok';
    };
    el.onerror = function() { st.textContent = 'not supported ✗'; st.className = 'status fail'; };
  }
}

check('png', 'img-png', 'img');
check('gif', 'img-gif', 'img');
check('webp', 'img-webp', 'img');
check('avif', 'img-avif', 'img');
check('vp8', 'vid-vp8', 'video');
check('vp9', 'vid-vp9', 'video');
check('av1-webm', 'vid-av1-webm', 'video');
check('av1-mp4', 'vid-av1-mp4', 'video');
check('opus', 'aud-opus', 'audio');
check('vorbis', 'aud-vorbis', 'audio');
check('flac', 'aud-flac', 'audio');
</script>
